# Checks every pull request, and every push to main. On main, also publishes the images the server runs:
# ghcr.io/mapsofmaking/mom-home:sha-<short commit> and :main (solid-kit ADR 011), and
# ghcr.io/mapsofmaking/mom-staging (same tags), what test.mapsofmaking.org serves (staging/README.md).
name: CI

# Branches are checked through their pull request only: a push to a branch with a PR used to start
# two identical runs (the branch and the PR's merge commit), in different concurrency groups.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build

  image:
    # The image as the server runs it: the app, the tree as Turtle, and
    # /id.jsonld only when PUBLIC_URL is set.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mom-home:ci .
      - name: no PUBLIC_URL, the app and the tree serve, /id.jsonld 404s
        run: |
          docker run -d --name bare -p 8081:80 mom-home:ci
          sleep 2
          curl -fsS http://localhost:8081/ | grep -q '<div id="app">'
          curl -fsSI http://localhost:8081/onboarding.ttl | grep -qi '^content-type: text/turtle'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/id.jsonld)
          [ "$code" = 404 ] || { echo "/id.jsonld answered $code, not 404"; exit 1; }
      - name: with PUBLIC_URL, /id.jsonld names that origin
        run: |
          docker run -d --name inst -p 8082:80 -e PUBLIC_URL=https://home.example.org/ mom-home:ci
          sleep 2
          curl -fsSI http://localhost:8082/id.jsonld | grep -qi '^content-type: application/ld+json'
          curl -fsS http://localhost:8082/id.jsonld | grep -q '"client_id": "https://home.example.org/id.jsonld"'

  staging-image:
    # The tour and the dry run as test.mapsofmaking.org serves them. Their tests run in verify.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f staging/Dockerfile -t mom-staging:ci .
      - name: the landing, the tour and the dry run serve
        run: |
          docker run -d --name staging -p 8083:80 mom-staging:ci
          sleep 2
          curl -fsS http://localhost:8083/ | grep -q 'href="tour/"'
          curl -fsS http://localhost:8083/tour/ | grep -q 'id="next"'
          curl -fsS http://localhost:8083/dry-run/ | grep -q 'id="tree"'
          curl -fsSI http://localhost:8083/dry-run/n3.min.js | grep -qi '^content-type: .*javascript'

  publish:
    needs: [verify, image, staging-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        run: |
          set -eu
          R=ghcr.io/mapsofmaking/mom-home
          SHA=sha-${GITHUB_SHA::7}
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t $R:$SHA -t $R:main .
          docker push $R:$SHA
          docker push $R:main
          S=ghcr.io/mapsofmaking/mom-staging
          docker build -f staging/Dockerfile --build-arg REVISION=${GITHUB_SHA::7} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t $S:$SHA -t $S:main .
          docker push $S:$SHA
          docker push $S:main
          echo "Pushed $SHA (mom-home, mom-staging)" >> "$GITHUB_STEP_SUMMARY"
