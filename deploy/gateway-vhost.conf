# =============================================================================
# SERVICE: Maps of Making home (mom-home)
# DOMAIN:  home.mapsofmaking.org
# BACKEND: container mom-home (gateway network, port 80)
# SSL:     Let's Encrypt, dedicated certificate for home.mapsofmaking.org
#
# TO INSTALL: copy to hetzner-gateway as nginx/conf.d/17-home-mapsofmaking.conf,
# then deploy from THAT repo. This copy is versioned beside the app it exposes
# so the two stay in step; hetzner-gateway remains the source of truth for
# routing.
#
# Note this proxies to a container rather than serving files from the gateway
# itself. Serving directly would mean editing the shared gateway compose and
# restarting the proxy that sits in front of every other service, for every
# deploy of this one.
#
# A dedicated certificate rather than a shared multi-domain one: a shared cert
# fails to renew as a block if any single one of its domains stops validating,
# taking unrelated services down with it. An isolated cert only ever risks this
# service.
# =============================================================================

server {
    listen       80;
    listen  [::]:80;
    server_name  home.mapsofmaking.org;

    access_log  /var/log/nginx/home_mapsofmaking_http_access.log combined;
    error_log   /var/log/nginx/home_mapsofmaking_error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen       443 ssl;
    listen  [::]:443 ssl;
    server_name  home.mapsofmaking.org;

    http2 on;

    # Docker's embedded DNS, needed by the runtime upstream lookup below.
    resolver 127.0.0.11 valid=30s ipv6=off;

    ssl_certificate     /etc/letsencrypt/live/home.mapsofmaking.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/home.mapsofmaking.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log  /var/log/nginx/home_mapsofmaking_https_access.log combined;
    error_log   /var/log/nginx/home_mapsofmaking_error.log;

    # The map's API, on this host: the page calls /api/ same-origin (geocode,
    # register, heartbeat), so link_handler needs no CORS. maps-nginx is the
    # map's container on the gateway network, as in 06-mapsofmaking.conf.
    location /api/ {
        set $maps http://maps-nginx:80;
        proxy_pass $maps;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    location / {
        # Variable + resolver so the upstream is resolved at request time.
        # A literal name here is resolved when the config loads, and nginx
        # refuses to start at all while the container is down — taking every
        # other site on this gateway with it.
        set $upstream http://mom-home:80;
        proxy_pass $upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_redirect off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
