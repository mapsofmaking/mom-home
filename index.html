<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      viewport-fit=cover is required, not cosmetic: without it every
      env(safe-area-inset-*) in core.css resolves to zero, and controls end up
      under the notch and the gesture bar.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Maps of Making · home</title>
    <!--
      Daylight only (Maps of Making, decided 2026-10-31): light is stamped on
      <html> above and nothing changes it. No stored choice, no device
      setting: the kit's theme script and button are left out of this page.
    -->
  </head>
  <body>
    <!--
      The instance's look (solid-kit ADR 011): mounted at /skin.css by the
      deploy (the design system's skins/kit/skin.css), absent otherwise (a 404
      costs nothing; the kit's look holds). In <body> on purpose: Vite puts the
      bundle's stylesheets at the end of <head>, and the skin must come after
      them to win at equal specificity.
    -->
    <link rel="stylesheet" href="/skin.css" />
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
