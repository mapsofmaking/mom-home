<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      viewport-fit=cover is required, not cosmetic: without it every
      env(safe-area-inset-*) in core.css resolves to zero, and controls end up
      under the notch and the gesture bar.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Maps of Making · home</title>
    <!--
      The stored theme choice, applied before first paint (see
      src/ui/theme.ts). It cannot wait for the module script: a dark choice
      would flash light on every load. Light needs nothing: it is stamped on
      <html> above. "system" is resolved here, contrast first, and followed
      while the page is open. Keep the key, the choices and the resolution in
      step with theme.ts: its test runs this script to check.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        function stored() {
          try { return localStorage.getItem("solid-kit:theme"); } catch (e) { return null; }
        }
        function device() {
          if (!window.matchMedia) return "light";
          if (matchMedia("(prefers-contrast: more)").matches) return "contrast";
          if (matchMedia("(prefers-color-scheme: dark)").matches) return "dark";
          return "light";
        }
        function apply() {
          var c = stored();
          if (c === "dark") root.dataset.theme = "dark";
          else if (c === "system") root.dataset.theme = device();
        }
        apply();
        if (!window.matchMedia) return;
        ["(prefers-contrast: more)", "(prefers-color-scheme: dark)"].forEach(function (q) {
          var m = matchMedia(q);
          if (m.addEventListener)
            m.addEventListener("change", function () { if (stored() === "system") apply(); });
        });
      })();
    </script>
  </head>
  <body>
    <!--
      The instance's look (solid-kit ADR 011): mounted at /skin.css by the
      deploy (the design system's skins/kit/skin.css), absent otherwise (a 404
      costs nothing; the kit's look holds). In <body> on purpose: Vite puts the
      bundle's stylesheets at the end of <head>, and the skin must come after
      them to win at equal specificity.
    -->
    <link rel="stylesheet" href="/skin.css" />
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
