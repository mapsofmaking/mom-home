  b.querySelectorAll("[data-accept]").forEach(el=>el.addEventListener("click",()=>{ const h = S.hs[el.dataset.accept]; h.state = "active"; S.justAccepted = el.dataset.accept; S.data.accepted = true; render(); }));
}
document.addEventListener("click", e=>{
  const r = e.target.closest("[data-role]"); if(!r) return;
  S.role = r.dataset.role; S.err = null; render();
});

/* ---------- words ---------- */
function renderWords(){
  const have = new Set(S.done.map(id=>byId[id].word).filter(Boolean));
  if(S.branch==="self") have.delete("pod");
  document.getElementById("wordbox").hidden = have.size===0;
  if(S.word && !have.has(S.word)) S.word=null;
  document.getElementById("words").innerHTML = WORDS.map(w => have.has(w.id)
    ? `<button type="button" class="word" data-w="${w.id}" aria-pressed="${S.word===w.id}" aria-describedby="tip-${w.id}">${esc(w.label)}<span class="tip" role="tooltip" id="tip-${w.id}">${esc(w.meaning)}</span></button>`
    : `<span class="word locked" aria-label="A word not met yet">· · ·</span>`).join("");
}

/* ---------- header: the session decides the mode ---------- */
function renderWho(){
  const w = document.getElementById("who");
  if(S.role==="welcome" || S.role==="treasury"){ w.innerHTML = `<span>Playing <b>${esc(netCol().name)}</b> · ${S.role}</span>`; return; }
  w.innerHTML = S.signedIn
    ? `<span>Signed in as <b>${esc(S.data.name)}</b></span><button type="button" class="ghost" id="signout">Sign out</button>`
    : `<button type="button" class="link" id="signin">Have a pod already? Sign in</button>`;
  document.getElementById("signout")?.addEventListener("click",()=>{ const dz=S.designer; SESSION=S; S=fresh(); S.designer=dz; render(); });
  document.getElementById("signin")?.addEventListener("click",()=>{
    if(SESSION){ const dz=S.designer; S=SESSION; SESSION=null; S.designer=dz; S.view="home"; S.err=null; }
    else S.view="signin";
    render();
  });
}

function render(){
  const st = states();
  renderMap(st);
  const opens = Object.values(st).filter(x=>x==="open").length;
  document.getElementById("tally").innerHTML = `Cleared <b>${S.done.length}</b> · Open <b>${opens}</b>`;
  document.getElementById("undo").disabled = !S.done.length && !S.step && !S.editing;
  document.getElementById("ttlbox").hidden = !S.designer;
  document.getElementById("colbox").hidden = !S.designer;
  renderWho();
  const net = S.role!=="space", wide = net || (S.signedIn && SETTINGS.fold);
  document.getElementById("foldbtn").hidden = !S.signedIn || wide;
  document.querySelector(".stage").classList.toggle("wide", wide);
  document.querySelector(".stage").classList.toggle("net", net);
  document.getElementById("hexrow").hidden = !wide || net;
  if(wide && !net) renderHexRow(st);
  renderBench(st);
  renderWords();
  renderRoles();
}

/* The folded hex view: one small hex per tile reached, in order, and what's left to discover. */
function renderHexRow(st){
  const reached = TILES.filter(t=>st[t.id]!=="fog").sort((a,b)=>a.prio-b.prio);
  const fog = TILES.length - reached.length;
  const pip = t => { const k=st[t.id], name = k==="cue" ? "Coming: "+t.cue : k==="lock" ? "Paused: "+t.title : t.title;
    return `<button type="button" class="pip-btn" data-pick="${t.id}" aria-label="${esc(name)}"${t.id===S.selected?' aria-current="step"':""}><svg class="pip st-${k}${t.id===S.selected?" sel":""}" viewBox="0 0 100 115.5" aria-hidden="true"><polygon points="50,4 96,30.4 96,85.1 50,111.5 4,85.1 4,30.4"/></svg>`
      + (k!=="cue" && ICONS[k==="lock"?"lock":t.icon] ? `<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="${ICONS[k==="lock"?"lock":t.icon]}"/></svg>` : "")
      + `<span class="tip" role="tooltip">${esc(name)}</span></button>`; };
  const row = document.getElementById("hexrow");
  row.innerHTML = `<p class="label" style="margin:0">What you can do</p><div class="pips">${reached.map(pip).join("")}<span class="hint">+ ${fog} to discover</span></div>
    <span class="hint">Now: <b>${esc(byId[S.selected].title)}</b></span><button type="button" class="link" id="seeall">Unfold</button>`;
  row.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>{ S.selected=b.dataset.pick; S.view=null; S.err=null; S.justSaved=false; S.justAccepted=null; S.gate=null; render(); }));
  document.getElementById("seeall").addEventListener("click",()=>setFold(false));
}
/* ---------- events ---------- */
function pick(g){
  if(!g || !g.hasAttribute("tabindex")) return;
  S.selected = g.dataset.id; S.view=null; S.err=null; S.editing=false; S.justSaved=false; S.justAccepted=null; S.gate=null; render();
  document.querySelector(`#map [data-id="${S.selected}"]`)?.focus();
  const bench = document.getElementById("bench");
  if(window.matchMedia("(max-width:60rem)").matches) bench.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
}
document.getElementById("map").addEventListener("click",e=>pick(e.target.closest(".hex")));
document.getElementById("map").addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(e.target.closest(".hex")); }});
document.getElementById("words").addEventListener("click",e=>{ const b=e.target.closest("button.word"); if(!b) return; S.word = S.word===b.dataset.w?null:b.dataset.w; renderWords(); });
document.addEventListener("keydown",e=>{ const f=document.getElementById("f-find"); if(e.key==="/" && f && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); f.focus(); } });
document.getElementById("undo").addEventListener("click",()=>{
  S.err=null; S.view=null;
  if(S.step || S.editing){ S.step=null; S.editing=false; render(); return; }
  const id = S.done.pop();
  if(id==="keep" && !S.fromPod){ S.branch=null; S.data.account=null; S.signedIn=false; }
  if(id==="join"){ S.data.accepted=false; S.hs={}; S.gate=null; S.justAccepted=null; removeSvc(); }
  if(byId[id]?.svc){ /* a collective tile: undone, it waits for its first look again */ }
  if(id==="change" && S.data.lastChange){ Object.entries(S.data.lastChange).forEach(([f,[from]])=>S.data[f]=from); S.data.lastChange=null; S.justSaved=false; syncEmail(); }
  S.selected = id || "describe"; render();
});
document.getElementById("reset").addEventListener("click",()=>{ const dz=S.designer; S=fresh(); SESSION=null; S.designer=dz; prefsClear(); settingsClear(); removeSvc(); render(); });
document.getElementById("foldbtn").addEventListener("click",()=>setFold(true));
document.getElementById("reveal").addEventListener("click",e=>{ S.designer=!S.designer; e.currentTarget.setAttribute("aria-pressed",S.designer); render(); });

/* Demo shortcuts, by address: #published lands on a space that's on the map, #member on one its network has
   accepted, so a showing can start where the federated part begins. Both use the tree's example space. */
function preset(name){
  S = fresh(); SESSION = null; const d = S.data;
  Object.assign(d, {name:EXAMPLE.name, address:EXAMPLE.address, description:EXAMPLE.description, email:EXAMPLE.email, website:EXAMPLE.website});
  d.contacts = [{type:"email",value:d.email}, ...(EXAMPLE.matrix?[{type:"matrix",value:EXAMPLE.matrix}]:[])];
  d.podName = slug(d.name)+"-"+slug(locality(d.address)); d.accEmail = d.email; d.account = {email:d.email};
  S.branch = "pod"; S.signedIn = true; S.done = ["describe","keep"]; S.selected = "keep";
  if(name==="member"){
    d.hours = ui(byId.change,"uiHoursPlaceholder"); d.network = "Brussels Makers"; S.done.push("change","join");
    const c = requestJoin(d.network); S.hs[c.id].state = "active"; d.accepted = true; S.justAccepted = c.id; S.selected = "join";
  }
}
function fromHash(){ const h = location.hash.slice(1);
  if(h==="published" || h==="member"){ removeSvc(); preset(h); return true; }
  if(h==="signin"){ removeSvc(); S = fresh(); SESSION = null; S.view = "signin"; return true; }   // the door for a space that already has a pod
  return false; }
window.addEventListener("hashchange",()=>{ if(fromHash()) render(); });
try{ loadTree(); loadCollectives(); loadPod(); fromHash(); render(); }
catch(err){ document.getElementById("bench").innerHTML = `<p class="label">Map</p><h2>The map didn't load</h2><p class="bernard err">— The tree wouldn't parse. Nothing you did.</p><p class="hint">Reload the page. If it keeps happening, the Turtle in this page has a mistake.</p>`; console.error(err); }
</script>
