<title>Maps of Making: dry run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Special+Elite&family=Caveat:wght@700&family=Inter+Tight:wght@400;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: a slim header, then the fog map beside Bernard's workbench (stacked on phones), then the strip of controls that never fog. Tokens: Solid Kit Daylight / Ink; Bernard's typewriter face is the one vertical-specific element. */
:root{
  --font-display:"Newsreader",Georgia,serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"Commit Mono",ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
  --font-bernard:"Special Elite","Courier New","Lucida Console",monospace;
  --surface:#f6f4ef; --surface-elevated:#fbfaf7; --surface-recessed:#f0ede4;
  --text-primary:#26241f; --text-secondary:#5c5647; --text-tertiary:#6d6757;
  --border:#e7e2d6; --border-subtle:#efece3;
  --accent:#3d6b52; --accent-contrast:#ffffff; --accent-soft:#eef3ef; --accent-line:#b8ccbf;
  --warn:#b5722a; --warn-soft:#faf3e6; --warn-line:#e3c9a3;
  --danger:#a33227; --danger-soft:#f9ecea;
  --fog:#e9e5da; --fog-line:#ddd8ca;
  --water:#dfe6e4; --land:#efeadf;
  /* mapsofmaking.org's own palette, for previews of the live map; not redefined in dark */
  --mom-ground:#e6e4e4; --mom-road:#c4c2c2; --mom-dot:#4a4a52; --mom-green:#5ea072; --mom-white:#ffffff;
  --mom-ink:#1a1a1a; --mom-muted:#6a6357; --mom-paper:#f7f2e7; --mom-paper-2:#efe9d9; --mom-cobalt:oklch(55% 0.17 250);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --surface:#12140f; --surface-elevated:#1b1e17; --surface-recessed:#0d0f0b;
    --text-primary:#eceadf; --text-secondary:#b8b3a3; --text-tertiary:#9a9585;
    --border:rgba(255,255,255,.09); --border-subtle:rgba(255,255,255,.05);
    --accent:#8fb98a; --accent-contrast:#12140f; --accent-soft:rgba(143,185,138,.14); --accent-line:rgba(143,185,138,.4);
    --warn:#d99a55; --warn-soft:rgba(217,154,85,.13); --warn-line:rgba(217,154,85,.35);
    --danger:#e0827a; --danger-soft:rgba(224,130,122,.13);
    --fog:#171a14; --fog-line:#22261e; --water:#1a2422; --land:#20231c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --surface:#12140f; --surface-elevated:#1b1e17; --surface-recessed:#0d0f0b;
  --text-primary:#eceadf; --text-secondary:#b8b3a3; --text-tertiary:#9a9585;
  --border:rgba(255,255,255,.09); --border-subtle:rgba(255,255,255,.05);
  --accent:#8fb98a; --accent-contrast:#12140f; --accent-soft:rgba(143,185,138,.14); --accent-line:rgba(143,185,138,.4);
  --warn:#d99a55; --warn-soft:rgba(217,154,85,.13); --warn-line:rgba(217,154,85,.35);
  --danger:#e0827a; --danger-soft:rgba(224,130,122,.13);
  --fog:#171a14; --fog-line:#22261e; --water:#1a2422; --land:#20231c;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--surface);color:var(--text-primary);font:1rem/1.6 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 16px;overscroll-behavior-y:none}
.wrap{max-width:80rem;margin:0 auto}
a{color:var(--accent);text-underline-offset:.18em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{padding-top:20px;display:flex;flex-wrap:wrap;gap:12px 32px;align-items:end;justify-content:space-between}
.eyebrow{display:flex;align-items:center;gap:12px;font:0.6875rem/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--text-tertiary);margin:0 0 8px}
.eyebrow::before{content:"";width:40px;border-top:1px solid currentColor;opacity:.6}
h1{font:400 clamp(1.75rem,3.5vw,2.25rem)/1.05 var(--font-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.label{font:0.6875rem/1.2 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);margin:0 0 10px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
button{font:600 0.9375rem/1 var(--font-body);border-radius:4px;padding:11px 16px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-contrast)}
button.ghost{background:transparent;color:var(--text-primary);border-color:var(--border);font-size:.875rem;padding:9px 12px}
button.ghost[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line)}
button.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:.18em;font-weight:400;font-size:.875rem}
button:disabled{opacity:.5;cursor:default}

.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;margin-top:10px;align-items:start}
.map-card{position:sticky;top:12px}
@media (max-width:60rem){.stage{grid-template-columns:1fr}.map-card{position:relative;top:auto}svg.map{max-height:55vh}}
.map-card,.bench{background:var(--surface-elevated);border:1px solid var(--border);border-radius:4px;padding:16px;min-width:0}
.bench{padding:18px 20px}
.map-bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:6px}
.tally{font:0.8125rem/1.3 var(--font-mono);color:var(--text-tertiary);font-variant-numeric:tabular-nums;margin:0}
.tally b{color:var(--text-primary);font-weight:700}
svg.map{display:block;width:100%;height:auto;max-height:calc(100dvh - 190px)}
.hex{cursor:pointer}
.hex polygon{stroke-width:1.2}
.hex text{font-family:var(--font-body);pointer-events:none}
.st-fog polygon{fill:var(--fog);stroke:var(--fog-line)}
.st-fog{cursor:default}
.st-cue polygon{fill:var(--surface-recessed);stroke:var(--text-tertiary);stroke-dasharray:4 4}
.st-cue text{fill:var(--text-tertiary);font-size:10.5px}
.st-open polygon{fill:var(--surface);stroke:var(--accent);stroke-width:2.2}
.st-open text{fill:var(--text-primary);font-size:11.5px;font-weight:600}
.st-done polygon{fill:var(--accent-soft);stroke:var(--accent-line)}
.st-done text{fill:var(--text-primary);font-size:11.5px}
.st-done .tick{fill:var(--accent);font-size:13px;font-weight:700}
.ghost-label text{fill:var(--text-tertiary);font-size:10px}
.hex.sel polygon{stroke:var(--accent);stroke-width:4;stroke-dasharray:none}
@media (prefers-reduced-motion:no-preference){.hex.sel polygon{animation:here .6s ease-out}}
@keyframes here{from{stroke-width:9;stroke-opacity:.35}to{stroke-width:4;stroke-opacity:1}}
.hex:focus{outline:none}
.hex:focus-visible polygon{stroke:var(--accent);stroke-width:3}
.legend{position:absolute;top:42px;left:16px;display:grid;gap:4px;font-size:0.75rem;line-height:1.2;color:var(--text-secondary);background:var(--surface-elevated);padding:4px 6px 4px 0;border-radius:2px;pointer-events:none}
@media (max-width:30rem){.legend{position:static;display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:6px}}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block}
.sw.done{background:var(--accent-soft);border:1px solid var(--accent-line)}
.sw.open{background:var(--surface);border:2px solid var(--accent)}
.sw.cue{background:var(--surface-recessed);border:1px dashed var(--text-tertiary)}
.sw.fog{background:var(--fog);border:1px solid var(--fog-line)}

.bench h2{font:600 1.25rem/1.25 var(--font-body);margin:0 0 8px;text-wrap:balance}
.chip{display:inline-block;font:0.6875rem/1 var(--font-mono);letter-spacing:.08em;padding:5px 8px;border-radius:999px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--text-primary);margin-right:6px}
.chip.dashed{background:transparent;border-style:dashed;border-color:var(--text-tertiary);color:var(--text-tertiary)}
.bernard{font-family:var(--font-bernard);font-size:16px;line-height:1.5;color:var(--text-primary);margin:0 0 12px;max-width:46ch}
.bernard.intro{color:var(--text-secondary);font-size:15px;margin-bottom:10px}
.bernard.err{color:var(--danger)}
.act{display:grid;gap:10px;margin:0 0 6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:30rem){.pair{grid-template-columns:1fr}}
.field{display:grid;gap:3px;min-width:0}
.field label{font-size:.875rem;font-weight:600}
.field input{font:1rem/1.4 var(--font-body);padding:8px 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text-primary);width:100%}
.field input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:0.8125rem;color:var(--text-secondary);margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fork{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:30rem){.fork{grid-template-columns:1fr}}
.fork button{background:var(--surface);color:var(--text-primary);border:1px solid var(--accent);text-align:left;padding:14px;line-height:1.35;display:grid;gap:6px}
.fork button span{font-weight:400;font-size:.8125rem;color:var(--text-secondary)}
.needs{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:6px;font-size:.9375rem}
.needs li{display:flex;gap:10px;align-items:baseline}
.needs i{font-style:normal;font-family:var(--font-mono);color:var(--text-tertiary);width:1.2em}
.needs .ok i{color:var(--accent)}

.preview{margin-top:20px;border-top:1px solid var(--border);padding-top:16px;display:grid;gap:12px}
.preview .label{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:0}
.pv{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:14px;min-width:0}
.pv h3{font:600 1rem/1.3 var(--font-body);margin:0 0 4px}
.pv .meta{font:0.8125rem/1.4 var(--font-mono);color:var(--text-tertiary);margin:0;overflow-wrap:anywhere}
.pv p{margin:0}
/* The live map's own surface (light in both themes, as on mapsofmaking.org) */
.mm{position:relative;height:13rem;border:1px solid var(--border);border-radius:2px;overflow:hidden;background:var(--mom-ground)}
.mm-base{position:absolute;inset:0;width:100%;height:100%}
.mm-ground{fill:var(--mom-ground)} .mm-road{stroke:var(--mom-road);stroke-width:3;fill:none} .mm-road.thin{stroke-width:1.5}
.mm-dot{fill:var(--mom-dot);stroke:var(--mom-white);stroke-width:1.5} .mm-dot.mine{fill:var(--mom-green);stroke:var(--mom-ink)}
.ep{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(16rem,calc(100% - 24px));background:var(--mom-white);color:var(--mom-ink);border:1.5px solid var(--mom-ink);box-shadow:3px 3px 0 var(--mom-ink);font-family:"Inter Tight",var(--font-body)}
.ep::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--mom-paper-2);border-right:1.5px solid var(--mom-ink);border-bottom:1.5px solid var(--mom-ink);transform:translateX(-50%) rotate(45deg)}
.ep-hero{padding:10px 12px;display:grid;gap:5px;border-bottom:1px dashed var(--mom-ink)}
.ep-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ep-name{font:700 1.5rem/1.05 "Caveat",cursive;overflow-wrap:anywhere}
.ep-logo{width:36px;height:36px;flex-shrink:0;display:grid;place-items:center;border:1.5px solid var(--mom-ink);background:var(--mom-paper-2);color:var(--mom-muted)}
.ep-addr{font:11px/1.3 "JetBrains Mono",var(--font-mono);color:var(--mom-muted)}
.ep-badges{display:flex;flex-wrap:wrap;gap:5px}
.ep-badge{font:500 10px/1.4 "JetBrains Mono",var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border:1.5px solid currentColor;background:var(--mom-paper)}
.ep-badge.claimed{color:var(--mom-cobalt);background:var(--mom-white)}
.ep-foot{padding:6px 12px;background:var(--mom-paper-2);font:600 10px/1.3 "JetBrains Mono",var(--font-mono);color:var(--mom-cobalt);position:relative;z-index:1}
.pf{display:grid;grid-template-columns:7rem 1fr;gap:6px 12px;margin:0}
.pf dt{font:500 .6875rem/1.6 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary)}
.pf dd{margin:0;font-size:.875rem;min-width:0;overflow-wrap:anywhere}
.pf .hit{color:var(--text-primary);font-weight:600}
.pf-empty{color:var(--text-tertiary);font-style:normal}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:.8125rem;padding:2px 8px;border-radius:999px;background:var(--surface-recessed);color:var(--text-secondary)}
.chat{display:grid;gap:8px}
.q,.a{padding:8px 12px;border-radius:4px;max-width:90%}
.q{justify-self:end;background:var(--surface-recessed)}
.a{justify-self:start;background:var(--accent-soft)}
.a.voice{font-family:var(--font-bernard)}
pre{margin:0;font:0.8125rem/1.5 var(--font-mono);background:var(--surface-recessed);padding:12px;border-radius:2px;overflow-x:auto}
.three{display:grid;gap:10px}
.mchip{display:inline-block;font:0.6875rem/1 var(--font-mono);letter-spacing:.08em;padding:5px 8px;border-radius:999px;text-transform:uppercase}
.mchip.declared{border:1px dashed var(--text-tertiary);color:var(--text-tertiary)}
.mchip.recognised{border:1px solid var(--text-tertiary);background:var(--surface-recessed);color:var(--text-primary)}
.log{font:0.8125rem/1.5 var(--font-mono);color:var(--text-secondary);font-variant-numeric:tabular-nums}

.strips{margin-top:8px;padding-top:10px;border-top:1px solid var(--border)}
.strips .label{margin-bottom:6px}
/* Wide screens: one-screen app. Map column holds still, the workbench scrolls. */
@media (min-width:60.01rem){
  .stage{height:calc(100dvh - 80px);align-items:stretch}
  .stage.wide{height:calc(100dvh - 142px)}
  .map-card{position:relative;top:auto;display:flex;flex-direction:column;min-height:0}
  svg.map{flex:1;min-height:0;max-height:none}
  .bench{overflow-y:auto;min-height:0;overscroll-behavior:contain}
}
.always{list-style:none;padding:0;margin:0;display:grid}
.always li{display:grid;grid-template-columns:9rem 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--border);font-size:0.9375rem}
.always b{font-weight:600}
.always span{color:var(--text-secondary)}
@media (max-width:30rem){.always li{grid-template-columns:1fr;gap:2px}}
.words{display:flex;flex-wrap:wrap;gap:8px}
/* Words you've met: status-label sized; met = printed like a done hex, not met = dashed dots */
.words{gap:5px}
.word{position:relative;font:400 .625rem/1.2 var(--font-mono);text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:0;border:1px solid var(--text-primary);background:var(--accent-soft);color:var(--text-primary);cursor:help}
.word.locked{background:transparent;border-style:dashed;border-color:var(--text-tertiary);color:var(--text-tertiary);cursor:default}
/* The meaning: after 1 s hover, at once on keyboard focus, on tap (aria-pressed) */
.tip{position:absolute;z-index:5;left:0;bottom:calc(100% + 6px);width:15rem;padding:6px 8px;background:var(--text-primary);color:var(--surface);font:400 .75rem/1.35 var(--font-body);text-transform:none;letter-spacing:0;text-align:left;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s 0s,visibility 0s .12s}
.word:hover .tip,.pip-btn:hover .tip{opacity:1;visibility:visible;transition-delay:1s,1s}
.word:focus-visible .tip,.word[aria-pressed="true"] .tip,.pip-btn:focus-visible .tip{opacity:1;visibility:visible;transition-delay:0s,0s}
.designer{margin-top:16px;border-top:1px dashed var(--text-tertiary);padding-top:12px;font-size:.875rem;color:var(--text-secondary);display:grid;gap:6px}
.designer code{font-family:var(--font-mono);font-size:.8125rem;overflow-wrap:anywhere}
details.ttl{margin-top:28px}
details.ttl summary{cursor:pointer;font-weight:600}
details.ttl pre{margin-top:12px;max-height:28rem}
.loading{color:var(--text-secondary)}
@media (prefers-reduced-motion:no-preference){.hex polygon{transition:fill .25s,stroke .25s}}
/* One header row, as on the canvas: wordmark left; who + the dry-run controls right */
.app-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;padding-top:10px}
.mark{display:flex;align-items:baseline;gap:10px}
.mark .logo{font:700 26px/1 "Caveat",cursive}
.mark .app{font:11px/1 var(--font-mono);color:var(--text-tertiary)}
.mark .tag-dry{font:10px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-tertiary);border:1px dashed var(--text-tertiary);padding:3px 6px;border-radius:2px}
.who{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.8125rem;color:var(--text-secondary)}
.who b{color:var(--text-primary)}
.who button.ghost{font-size:.8125rem;padding:6px 10px}
.who .sep{width:1px;align-self:stretch;background:var(--border)}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin:0 0 12px;padding-bottom:10px;border-bottom:1px dashed var(--border)}
.head h2{margin:0;flex:1 1 auto}
.status{font:600 .6875rem/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:2px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--text-primary)}
.status.broken{border-color:var(--danger);background:var(--danger-soft)}
.out{margin-top:18px;padding-top:14px;border-top:1px dashed var(--border);display:grid;gap:10px}
.out .bernard{margin:0}
a.cta{display:inline-block;font:600 .9375rem/1 var(--font-body);border-radius:4px;padding:11px 16px;background:var(--accent);color:var(--accent-contrast);text-decoration:none;border:1px solid var(--accent)}
a.ghost-link{display:inline-block;font:600 .9375rem/1 var(--font-body);border-radius:4px;padding:10px 14px;border:1px solid var(--border);color:var(--text-primary);text-decoration:none}
.fork .where{font:.75rem/1.3 var(--font-mono);color:var(--text-tertiary)}
.hint.is-error{color:var(--danger)}
.field input[aria-invalid="true"]{border-color:var(--danger);outline:1px solid var(--danger)}
.field input.mono{font-family:var(--font-mono);font-size:.9375rem}
#f-pass::placeholder{font-size:.875rem}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.steps{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px;font-size:.9375rem}
.steps li{display:grid;grid-template-columns:1.75rem 1fr;gap:10px;align-items:baseline}
.steps i{font:600 .8125rem/1.6rem var(--font-mono);font-style:normal;text-align:center;width:1.6rem;height:1.6rem;border:1.5px solid var(--text-tertiary);border-radius:50%;color:var(--text-tertiary)}
.steps .now i{border:2.5px solid var(--text-primary);color:var(--text-primary)}
.steps .ok i{background:var(--accent-soft);border-color:var(--accent-line);color:var(--text-primary)}
.addr{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;font:.875rem/1.4 var(--font-mono);overflow-wrap:anywhere}
.readers .pv .pv{border:0;padding:12px 0 0;background:none}
.readers{display:grid;align-items:start;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:10px}
.was{list-style:none;padding:0;margin:10px 0 4px;display:grid;gap:2px;font-size:.875rem;color:var(--text-secondary)}
.was b{color:var(--text-primary);font-weight:600}
pre.file{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.75rem}
pre.file > span{display:block}
/* Terminal: the design system's terminal tokens, the same in both themes */
pre.term{--t-bg:#18160f;--t-head:#0e0c08;--t-rule:#2a261c;--t-fg:#c8c0a8;--t-key:#8fc4e8;--t-str:#b8d89a;--t-num:#e8c87a;
  background:var(--t-bg);color:var(--t-fg);border:1px solid var(--t-rule);border-top:6px solid var(--t-head);border-radius:2px;color-scheme:dark}
pre.term .tk{color:var(--t-key)} pre.term .ts{color:var(--t-str)} pre.term .tn{color:var(--t-num)}
pre.file .chg{background:rgba(143,196,232,.14);box-shadow:inset 3px 0 var(--t-key,var(--accent));margin-inline:-12px;padding-inline:12px}
[hidden]{display:none!important}
/* Tile C's tool, as in mom-home: a logo on the card, contact pictos, one row per contact handle */
.ep-logo img{width:100%;height:100%;object-fit:contain}
.ct-picto{display:block;fill:currentColor}

  onb:act "event" ; onb:preview "mapcard" ;

:answer a onb:Tile ;

  onb:q 3 ; onb:r -2 ; onb:prio 6 ;

  onb:doneWhen """ASK { ?agent solid:owner <> . ?acl acl:agent ?agent ; acl:accessTo ?folder }""" .

:second a onb:Tile ;

:peers a onb:Tile ;

:agenda a onb:Tile ;

  onb:act "none" ; onb:preview "agenda" ;
  onb:say "Your events on the network's calendar. You don't post twice."@en ;

:discord a onb:Tile ;

:mentor a onb:Tile ;

:pod a onb:Word ; onb:label "pod" ; onb:prio 1 ;
  onb:meaning "Personal Online Datastore: storage that's yours."@en .

# ---- The profile (14.6 S4): what tile C's tool lists, checks and writes. A field is data: a tile or a
# network adds one by adding a node here. onb:kind says how the code reads and writes it (text, email, url,
# matrix, image, place); onb:property is the predicate on the space for a simple kind (text, email, url,
# image), and absent for matrix and place, which the code writes its own way. onb:file: where it lives.
# The contact handles: onb:shape says how the code checks one and writes its link (email, phone, matrix,
# url, at); onb:property puts it as a statement of its own on the space, onb:contactType as a
# schema:contactPoint with that type and a schema:url. The map's card shows each with its picto.
# Sections are what the Finder groups by; the names are a first guess, adjusted as the profile grows.

:times a onb:Section ; onb:label "Hours"@en ; onb:prio 4 .

:ct-email a onb:ContactType ; onb:key "email" ; onb:shape "email" ; onb:property schema:email ; onb:prio 1 ;

:ct-phone a onb:ContactType ; onb:key "phone" ; onb:shape "phone" ; onb:property schema:telephone ; onb:prio 2 ;

:ct-link a onb:ContactType ; onb:key "link" ; onb:shape "url" ; onb:contactType "Link" ; onb:prio 8 ;
  onb:label "Link"@en ; onb:placeholder "https://..."@en ; onb:hint "Any other place: a forum, a newsletter, a form."@en .
</script>
<script type="text/turtle" id="collectives">
@prefix onb: <https://mapsofmaking.org/ns/onboarding#> .
@prefix : <https://mapsofmaking.org/dryrun/collectives#> .

# Dry-run additions, prospective (Onboard Storyboard, page 3). Not in mom-home yet.
# 1. Lines the dry run needs that the tree doesn't have yet (:copy): the fold's first showing,
#    a request waiting, a collective saying yes.
# 2. What each collective publishes in its own pod, so a member's home can grow the tiles that come
#    with a handshake: its tools (onb:ServiceTile) and its renewal rule (onb:RenewalRule).
#    A tool reads like any tile: onb:cue is the intent, the why, shown while it's still ahead;
#    onb:title is the what, shown once it opens; onb:say is Bernard at its first look.
#    onb:storage: onb:CollectivePod (their server), onb:MemberPod (yours), onb:Mixed (yours, shown by theirs).
#    The renewal rule is the collective's own, accepted on joining: home reads it, never sets it.

:copy a onb:CollectiveCopy ;
  onb:sayFold "Working here often? Fold the hexes into a row and the tools get the room. It stays that way, whatever tile you open."@en ;
  onb:sayWaiting "Request's with {collective}. They answer, not me."@en ;
  onb:uiWaitHint "Dry run: they answer in {seconds} s. For real, it takes a day or a week."@en ;
  onb:sayAhead "Their pod says what they open to members: {count}, once they say yes."@en ;
  onb:sayAccepted "{collective} said yes. You're a member."@en ;
  onb:sayOffers "They open {count} to members. On your map now, still ahead:"@en ;
  onb:sayNoTools "They don't share tools yet. When they do, they show up on your map."@en ;
  onb:sayShelves "Each collective runs its own tools, so the label says whose."@en ;
  onb:sayReminder "{collective} says your membership is due. Everything still works. Their next step is on {next}, if nothing changes."@en ;
  onb:sayPaused "Paused, not ended. Nothing is deleted. Renew with {collective} and everything comes back the way you left it."@en ;
  onb:sayRestored "You're back in. Everything is where you left it."@en ;
  onb:sayGate "The gate asks {collective}'s pod whether you're in."@en ;
  onb:sayRefused "{collective} has paused your membership, so its tools won't let you in. Nothing is deleted."@en ;
  onb:sayOpened "In. What you draw stays on {collective}'s server, under their rules."@en .

:bm a onb:Collective ;

<script type="text/turtle" id="pod">
# The demo pod, as a sign-in reads it: https://weld-done.pod.mapsofmaking.org/space.ttl (copied 2026-11-13).
# The dry run reads this copy, never the pod. Left out on purpose, to show what a pod filled in by another
# app can lack: the address (the map needs it) and the opening hours (they can wait).
@prefix schema: <https://schema.org/>.
@prefix mom: <https://mapsofmaking.org/ns/mom#>.

<https://weld-done.pod.mapsofmaking.org/space.ttl#space> a mom:Space, schema:Place;
    schema:name "Weld Done";
    schema:description "Metal shop with two welding stations. Gloves provided, sparks included.";
    schema:email "hello@welddone.example";
    schema:url <https://welddone.example/>;
    schema:contactPoint
      [ a schema:ContactPoint; schema:url <https://matrix.to/#/%23welddone:matrix.org>; schema:contactType "Matrix" ],
      [ a schema:ContactPoint; schema:url <https://t.me/welddone>; schema:contactType "Telegram" ];
    schema:logo <https://weld-done.pod.mapsofmaking.org/logo>.
</script>
<script src="https://cdn.jsdelivr.net/npm/n3@1.17.4/browser/n3.min.js"></script>
<script>
const ONB = "https://mapsofmaking.org/ns/onboarding#";
const RDFT = "http://www.w3.org/1999/02/22-rdf-syntax-ns#type";
let TILES = [], byId = {}, WORDS = [], wordById = {}, APP = {}, SECTIONS = [], PFIELDS = [], CTYPES = [];

function loadTree(){
  const src = document.getElementById("tree").textContent;
  const quads = new N3.Parser().parse(src);
  const subj = {};
  quads.forEach(q=>{
    const s = q.subject.value, p = q.predicate.value;
    (subj[s] ||= {})[p] ||= [];
    subj[s][p].push(q.object);
  });
  const local = iri => iri.split("#").pop();
  const one = (o,k) => o[ONB+k] ? o[ONB+k][0].value : undefined;
  const many = (o,k) => (o[ONB+k]||[]).map(x=>local(x.value));
  Object.entries(subj).forEach(([s,o])=>{
    const type = (o[RDFT]||[]).map(x=>x.value);
    if(type.includes(ONB+"Tile")){
      TILES.push({id:local(s), title:one(o,"title"), cue:one(o,"cue"),
        q:+one(o,"q"), r:+one(o,"r"), prio:+one(o,"prio"),
        all:many(o,"requiresAll"), any:many(o,"requiresAny"),
        needsPod:one(o,"needsPod")==="true", emergent:one(o,"emergent")==="true", planned:one(o,"planned")==="true",
        act:one(o,"act")||"none", icon:one(o,"icon"), preview:one(o,"preview"), word:o[ONB+"unlocksWord"]?local(one(o,"unlocksWord")):null,
        say:one(o,"say"), sayNext:one(o,"sayNext"), sayTool:one(o,"sayTool"), saidSaved:one(o,"saidSaved"), saidDone:one(o,"saidDone"), saidDoneSelf:one(o,"saidDoneSelf"),
        sayPod:one(o,"sayPod"), sayConsent:one(o,"sayConsent"), sayTaken:one(o,"sayTaken"), doneWhen:one(o,"doneWhen"),
        lead:one(o,"lead"), uiSeeMap:one(o,"uiSeeMap"),
        // every onb:ui* line of the tile, by name: the app's own words, read from the tree as mom-home does
        ui:Object.fromEntries(Object.keys(o).filter(p=>p.startsWith(ONB+"ui")).map(p=>[p.slice(ONB.length), o[p][0].value]))});
    } else if(type.includes(ONB+"Word")){
      WORDS.push({id:local(s), label:one(o,"label"), meaning:one(o,"meaning"), prio:+one(o,"prio")});
    } else if(type.includes(ONB+"App")){
      APP = {sayNeedsPod:one(o,"sayNeedsPod")};
    } else if(type.includes(ONB+"Section")){
      SECTIONS.push({id:local(s), label:one(o,"label"), prio:+one(o,"prio")});
    } else if(type.includes(ONB+"ProfileField")){
      // The profile registry (tile C's tool): a field is data, its kind is code.
      PFIELDS.push({key:one(o,"key"), kind:one(o,"kind"), section:local(one(o,"section")||""), prio:+one(o,"prio"),
        label:one(o,"label"), hint:one(o,"hint"), placeholder:one(o,"placeholder"), required:one(o,"required")==="true"});
    } else if(type.includes(ONB+"ContactType")){
      CTYPES.push({key:one(o,"key"), label:one(o,"label"), placeholder:one(o,"placeholder"), prio:+one(o,"prio"),
        property:one(o,"property") ? one(o,"property").replace("https://schema.org/","schema:") : null, contactType:one(o,"contactType")});
    }
  });
  [WORDS, SECTIONS, PFIELDS, CTYPES].forEach(list=>list.sort((a,b)=>a.prio-b.prio));
  byId = Object.fromEntries(TILES.map(t=>[t.id,t]));
  wordById = Object.fromEntries(WORDS.map(w=>[w.id,w]));
  document.getElementById("ttlsrc").textContent = src.trim();
  // tile A's example: the onb:field nodes' onb:example values (street + city make the dry run's one address line)
  const ex = {};
  (subj["https://mapsofmaking.org/onboarding/space-coordinator#describe"]?.[ONB+"field"]||[]).forEach(b=>{ const o=subj[b.value]; if(o && one(o,"key")) ex[one(o,"key")] = one(o,"example"); });
  EXAMPLE = {name:ex.name||"", address:[ex.street,ex.city].filter(Boolean).join(", "), description:ex.description||"", email:ex.email||"", website:ex.website||"", matrix:ex.matrix||""};
  PASS_HINT = byId.keep.ui.uiPodPassHint || PASS_HINT;
  if(EXAMPLE.name) TAKEN.add(slug(EXAMPLE.name));
}

/* ---------- state ----------
   view: null shows the selected tile; "home" the signed-in resting panel; "signin" the sign-in door.
   step (tile B only): null = the two doors, "pod" = the account form, "consent" = the pod's own page.
   SESSION holds the signed-in state while signed out, so Sign in brings it back: the session decides the mode. */
/* "Fill in an example" reads onb:example from the tree, as mom-home does: a space that doesn't exist (Weld Done). */
let EXAMPLE = {name:"", address:"", description:"", email:""};
const TAKEN = new Set(["atelier-du-canal"]);   // the dry run's pod server already has these; the example's name joins them
let S, SESSION = null;
/* The pod a sign-in finds (the "pod" Turtle above): who it belongs to and what its space file already says. */
let POD = null;
function loadPod(){
  const el = document.getElementById("pod"); if(!el) return;
  const SC = "https://schema.org/", subj = {};
  new N3.Parser().parse(el.textContent).forEach(q=>{ ((subj[q.subject.value] ||= {})[q.predicate.value] ||= []).push(q.object); });
  const hit = Object.entries(subj).find(([,o])=>(o[RDFT]||[]).some(x=>x.value==="https://mapsofmaking.org/ns/mom#Space")); if(!hit) return;
  const [iri, o] = hit, v = (n,k) => n && n[SC+k] ? n[SC+k][0].value : "", host = new URL(iri).host;
  const a = subj[(o[SC+"address"]||[])[0]?.value];
  const handle = url => /matrix\.to/.test(url) ? decodeURIComponent(url.split("#/").pop()) : /\/\/t\.me\//.test(url) ? "@"+url.split("t.me/").pop() : url;
  const contacts = [...(v(o,"email")?[{type:"email",value:v(o,"email")}]:[]),
    ...(o[SC+"contactPoint"]||[]).map(n=>subj[n.value]).filter(Boolean).map(c=>({type:(CTYPES.find(t=>t.key===v(c,"contactType").toLowerCase())||{key:"link"}).key, value:handle(v(c,"url"))}))];
  POD = {host, name:host.split(".")[0], webid:`https://${host}/profile/card#me`,

function states(){

  const cand = TILES.filter(t=>!t.svc && !isDone(t.id) && reqsMet(t)).sort((a,b)=>a.prio-b.prio);

function renderMap(st){
  const svg = document.getElementById("map");
  const xs=TILES.map(t=>px(t)[0]), ys=TILES.map(t=>px(t)[1]), pad=HS+6;
  svg.setAttribute("viewBox",`${Math.min(...xs)-pad} ${Math.min(...ys)-pad} ${Math.max(...xs)-Math.min(...xs)+pad*2} ${Math.max(...ys)-Math.min(...ys)+pad*2}`);
  let html = "";
  TILES.forEach(t=>{
    const [cx,cy]=px(t), s=st[t.id];
    let label = s==="done"||s==="open"||s==="lock" ? (t.svc ? t.title+" · "+colById[t.svc.c].name : t.title) : s==="cue" ? t.cue : "";
    let cls = "hex st-"+s+(!S.view && S.selected===t.id?" sel":"");
    if(s==="fog" && S.designer){ label=t.title; cls+=" ghost-label"; }
    const small = s==="cue"||s==="fog";
    const lines = label ? wrap(label, small?14:13) : [];
    const lh = small?13:14, y0 = cy-(lines.length-1)*lh/2+(s==="done"||s==="lock"?8:4);
    const interactive = s!=="fog" || S.designer;
    const aria = s==="fog" ? (S.designer ? t.title+", in the fog" : "Still to discover") : s==="cue" ? "Coming: "+t.cue : s==="lock" ? t.title+", paused by "+colById[t.svc.c].name : t.title+(s==="done"?", done":", you can do it now");
    html += `<g class="${cls}" data-id="${t.id}" ${interactive?'tabindex="0" role="button"':''} aria-label="${esc(aria)}"><polygon points="${poly(cx,cy)}"/>`;
    if(s==="done") html += `<text class="tick" x="${cx}" y="${cy-HS*0.52}" text-anchor="middle">✓</text>`;
    if(s==="lock") html += `<g transform="translate(${cx-8} ${cy-HS*0.86})"><path class="lk" d="${ICONS.lock}"/></g>`;
    lines.forEach((ln,i)=>{ html += `<text x="${cx}" y="${y0+i*lh}" text-anchor="middle">${esc(ln)}</text>`; });
    html += `</g>`;
  });
  svg.innerHTML = html;
}

    const lead = fp ? podBanner() : s!=="done" && t.lead ? `<p class="lead">${esc(t.lead)} <a href="https://mapsofmaking.org" target="_blank" rel="noopener">${esc(t.uiSeeMap||"See the map ↗")}</a></p>` : "";
    return head(t.title, s==="done"?"Done":"") + lead + `<form class="act" id="f-describe" novalidate>
        ${field("f-name","Name"+tag("name"),d.name,{cls:need("name")?"lacking":"", attrs:'autocomplete="organization" placeholder="The name your community knows"', hint:need("name")?"Your pod doesn't say this yet.":""})}
        ${field("f-address","Street Address"+tag("address"),d.address,{cls:need("address")?"lacking":"", attrs:'autocomplete="street-address"', hint:need("address")?"Your pod doesn't say this yet. The map needs it to put your pin: street, number, postcode and town.":"Street, number, postcode and town. The map puts your pin there."})}

    out = S.notNow

  }

/* ---------- tile C: update it once, the first workbench mini-app ----------
   One cycle for every tile after B: first open = a short tutorial (here: change the hours, watch both readers);
   done is written in the pod; reopened = the tool (here: the whole profile, one form, same readers). */
/* The tool's fields come from the tree's registry (onb:Section, onb:ProfileField, onb:ContactType), as in mom-home. */
/* Stand-in for genjson's automatic geocoding (Nominatim proxy): same address, same point. */
function hash(s){ let h=7; for(const c of String(s)) h=(h*31+c.charCodeAt(0))>>>0; return h; }
function geo(addr){ const h=hash(addr); return {lat:(50.8+(h%900)/10000).toFixed(4), long:(4.3+((h>>10)%900)/10000).toFixed(4), x:110+h%180, y:110+(h>>8)%90}; }
/* The file as saved: the lines of space.ttl the tile touches. Predicates are illustrative (Story 14.7 maps them). */
function fileHtml(hit, d=D()){
  const g = geo(d.address), q = v => JSON.stringify(v||"");
  // A handle with a property of its own (email, phone) is one statement; the others are a schema:contactPoint.
  const handles = cClean(d.contacts).map(h=>{ const t = CTYPES.find(x=>x.key===h.type);
    return ["contacts", t && t.property ? `  ${t.property} ${q(h.value)} ;` : `  schema:contactPoint [ schema:contactType ${q(t?t.contactType:h.type)} ; schema:url ${q(h.value)} ] ;`]; });
  const lines = [[null,"<#it> a mom:Space ;"],["name",`  schema:name ${q(d.name)} ;`],...(d.logo?[["logo",`  schema:logo ${q(d.logo)} ;`]]:[]),
    ["description",`  schema:description ${q(d.description)} ;`],["address",`  schema:address ${q(d.address)} ;`],
    ["address",`  geo:lat ${g.lat} ; geo:long ${g.long} ;`],...(d.website?[["website",`  schema:url ${q(d.website)} ;`]]:[]),
    ["hours",`  schema:openingHours ${q(d.hours)} ;`],...handles,
    [null,`  dct:modified "${S.savedAt||new Date(Date.now()-2*864e5).toISOString().slice(0,11)+"09:12Z"}" .`]];
  return `<pre class="file term">${lines.map(([f,l])=>`<span class="${f&&hit.has(f)?"chg":""}">${hl(l)}</span>`).join("")}</pre>`;
}

/* Source in a terminal: the file reads as the raw thing it is, in contrast with the paper UI. */
function hl(text){
  return String(text).replace(/("(?:[^"\\]|\\.)*")(\s*:)?|(<#\w+>|\b[a-z]+:[A-Za-z]+\b)|(-?\b\d+(?:\.\d+)?\b)|([^"<a-z\d-]+|[\s\S])/g,

/* Propagation, read left to right: your file, then the card the map draws from it.
   file/card: the data each shows (they differ while the map hasn't read the file yet). */
function flowHtml({file=D(), card=D(), hit=new Set(), fileNote="Your file · space.ttl", cardNote="Your card on the map"}={}){
  const focus = ["hours","description","website","contacts"].find(f=>hit.has(f)) || null;
  return `<div class="flow"><div class="pv"><p class="hint" style="margin-bottom:8px">${esc(fileNote)}</p>${fileHtml(hit, file)}</div>
    <span class="arrow" aria-hidden="true">→</span>
    <div class="pv"><p class="hint" style="margin-bottom:8px">${esc(cardNote)}</p>${onMap(card)}${profile(focus,"Open the profile, and it shows",card)}</div></div>`;
}
const wasHtml = ch => { const keys=Object.keys(ch||{}); return keys.length ? `<ul class="was">${keys.map(f=>`<li><b>${esc(flabel(f))}</b> was ${esc((f==="contacts"?cText(ch[f][0]):ch[f][0])||"empty")}${f==="address"?". The pin moved with it":""}</li>`).join("")}</ul>` : ""; };
/* The data as it was before the last change: what the card shows until the map reads the file. */
const before = () => { const d={...D()}; Object.entries(D().lastChange||{}).forEach(([f,[from]])=>d[f]=from); return d; };
const TAB_HINT = `<p class="hint">Map open in another tab? Reload it to see the change.</p>`;
function pendingHtml(){
  const n = S.pending.step, labels = S.pending.labels;
  return steps(labels.map((label,i)=>[i<n?"✓":String(i+1), i<n?"ok":i===n?"now":"", i<n?`<strong>${label}.</strong>`:label+(i===n?"…":"")]))
    + (S.pending.slow?`<p class="hint" style="margin-top:8px">Taking longer than usual. It's the map, not you. It keeps trying.</p>`:"");
}
function save(changes, tutorial){
  const d = D(); d.lastChange = {};
  Object.entries(changes).forEach(([f,v])=>{ d.lastChange[f]=[d[f],v]; d[f]=v; });
  syncEmail();
  // An address change is geocoded first, as in genjson: the address and the pin move together, or neither does.
  const labels = [...(changes.address!==undefined?["Found the new address"]:[]),"Written to your pod","The map read it"];
  // "The map read it" is the targeted heartbeat (POST /api/heartbeat-space/{id}): synchronous, rebuilds the map's data.
  S.pending = {step:0, tutorial, labels}; S.lastLabels = labels; S.err=null; S.savedAt = new Date().toISOString().slice(0,16)+"Z"; render();

  labels.forEach((_,i)=>setTimeout(()=>{
    if(!S.pending) return;
    S.pending.step = i+1;
    if(i===labels.length-1){ S.pending=null; S.justSaved = tutorial ? "tutorial" : "tool"; if(tutorial) return complete("change"); }

/* The address is checked while it's typed (after a pause) and when the field is left, not after the

function setErr(id, msg){

  $("f-tool")?.addEventListener("input",toolUpdate);
  $("f-tool")?.addEventListener("change",e=>{
    const row = e.target.closest(".handle"); if(!row || e.target.tagName!=="SELECT") return;
    const k = CTYPES.find(x=>x.key===e.target.value); row.querySelector(".sp-channel").innerHTML = contactPicto(k.key); row.querySelector("input").placeholder = k.placeholder||""; toolUpdate(); });
  // Handles are added and removed in place: a re-render would drop what's typed in the other fields.
  $("f-tool")?.addEventListener("click",e=>{
    if(e.target.closest("[data-handle-add]")){
      const used = new Set([...document.querySelectorAll("#handles select")].map(s=>s.value)), k = CTYPES.find(x=>!used.has(x.key)) || CTYPES[0];
      $("handles").insertAdjacentHTML("beforeend", handleRow({type:k.key, value:""})); $("handles").lastElementChild.querySelector("input").focus();
    } else if(e.target.closest("[data-handle-remove]")){ e.target.closest(".handle").remove(); toolUpdate(); }
  });
  $("f-tool")?.addEventListener("submit",e=>{ e.preventDefault(); const ch = toolChanges();
    // Errors are set in place (no re-render), so nothing typed is lost.
    setErr("f-t-name", ch.name==="" ? "Needed: the name your community knows." : ""); setErr("f-t-address", ch.address==="" ? "Needed: street, number and town." : "");
    if(ch.name==="") return $("f-t-name").focus();
    if(ch.address==="") return $("f-t-address").focus();
    if(!Object.keys(ch).length) return;
    save(ch, false); });
  /* Finder: typing replaces the form with matches grouped by section; ↑↓ move, Enter goes, Esc clears. */
  let fdOn = 0;
  const fold = t => String(t).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const mark = (txt,q) => { const w = q.trim().split(/\s+/)[0]||"", i = txt.toLowerCase().indexOf(w.toLowerCase()); return i<0 || !w ? esc(txt) : esc(txt.slice(0,i))+"<mark>"+esc(txt.slice(i,i+w.length))+"</mark>"+esc(txt.slice(i+w.length)); };
  const fdHits = q => { const words = fold(q).split(/\s+/).filter(Boolean), dr = toolDraft(); if(!words.length) return [];
    const rows = PFIELDS.map(f=>({key:f.key, label:f.label, section:f.section, value:f.kind==="contacts" ? cText(dr.contacts) : (dr[f.key]||"")}))
      .filter(r=>words.every(w=>fold(r.label+" "+r.value).includes(w)));
    return SECTIONS.flatMap(sec=>rows.filter(r=>r.section===sec.id)); };
  const fdGo = key => { $("f-find").value=""; fdShow(); const el = key==="contacts" ? (document.querySelector("#handles input") || document.querySelector("[data-handle-add]")) : $("f-t-"+key);
    el.focus(); const box = el.closest(".field"); box.classList.add("flash"); setTimeout(()=>box.classList.remove("flash"),900); };
  function fdShow(){
    const q = $("f-find").value.trim(), box = $("fd-results");
    $("f-tool").hidden = !!q; box.hidden = !q; $("fd-clear").hidden = !q; $("fd-key").hidden = !!q;
    if(!q) return;
    const hits = fdHits(q); fdOn = Math.min(fdOn, Math.max(hits.length-1,0));
    box.innerHTML = `<div class="fd-meta"><span>${esc(ui(C,"uiProfileFindCount","",{n:hits.length}))}</span><span>↑↓ to move · Enter to go · Esc to clear</span></div>`
      + (hits.length ? SECTIONS.filter(sec=>hits.some(r=>r.section===sec.id)).map(sec=>`<div class="fd-head"><span aria-hidden="true">▾</span>${esc(sec.label)}</div>`
        + hits.filter(r=>r.section===sec.id).map(r=>`<button type="button" class="fd-row${hits[fdOn].key===r.key?" on":""}" data-fd="${r.key}"><b>${mark(r.label,q)}</b><span>${r.value?mark(r.value,q):esc(ui(C,"uiProfileEmpty"))}</span></button>`).join("")).join("")
        : `<p class="hint">${esc(ui(C,"uiProfileFindNone"))}</p>`);
    box.querySelectorAll("[data-fd]").forEach(b=>b.addEventListener("click",()=>fdGo(b.dataset.fd)));
  }
  $("f-find")?.addEventListener("input",()=>{ fdOn=0; fdShow(); });
  $("f-find")?.addEventListener("keydown",e=>{
    const hits = fdHits($("f-find").value.trim());
    if(e.key==="Escape"){ $("f-find").value=""; fdShow(); }
    else if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(hits.length){ fdOn=(fdOn+(e.key==="ArrowDown"?1:hits.length-1))%hits.length; fdShow(); } }
    else if(e.key==="Enter" && $("f-find").value.trim() && hits.length){ e.preventDefault(); fdGo(hits[fdOn].key); }
  });
  $("fd-clear")?.addEventListener("click",()=>{ $("f-find").value=""; fdShow(); $("f-find").focus(); });
  $("f-net")?.addEventListener("submit",e=>{ e.preventDefault(); const v=$("f-network").value.trim(); if(!v) return fail("f-network","Needed: any name your network goes by."); S.data.network=v; S.data.accepted=false; requestJoin(v); complete("join"); });
  $("f-event")?.addEventListener("submit",e=>{ e.preventDefault(); const ti=$("f-evtitle").value.trim(), da=$("f-evdate").value; if(!ti) return fail("f-evtitle","Needed: a title."); if(!da) return fail("f-evdate","Needed: a date."); S.data.event={title:ti,date:da}; complete("event"); });
  $("doit")?.addEventListener("click",()=>complete(t.id));
  document.querySelectorAll("#bench [data-fold]").forEach(el=>el.addEventListener("click",()=>{ SETTINGS.foldIntro=true; setFold(el.dataset.fold==="1"); }));
  wireCollectives();
  document.querySelectorAll("#bench [data-go]").forEach(b=>b.addEventListener("click",e=>{ S.selected=e.currentTarget.dataset.go; S.view=null; S.err=null; S.justSaved=false; S.justAccepted=null; S.gate=null; render(); }));
  document.querySelector("#bench [data-view]")?.addEventListener("click",e=>{
    const v = e.currentTarget.dataset.view; S.view=v; S.err=null; S.justSaved=false; S.gate=null;
    // Back to your tiles = back to the hexes: unfold, or the page has nothing to show
    if(v==="home" && SETTINGS.fold){ SETTINGS.fold=false; keep(SETTINGS_KEY, SETTINGS); }
    render(); });
  document.querySelector("[data-copy]")?.addEventListener("click",()=>{
    const txt = document.querySelector("[data-copy]").dataset.copy==="url" ? fileUrl() : spaceJson(), note = $("copied");
    try{ navigator.clipboard.writeText(txt).then(()=>note.textContent="Copied.",()=>note.textContent="Select the text to copy it."); }
    catch(_){ note.textContent="Select the text to copy it."; }
  });
}


/* ---------- Part 3 · collectives (prospective: storyboard page 3) ----------
   The same exploration loop as the tile tree (introduction → onboarding → scaffolding → endgame):
   joining is a request that waits for the collective's answer; a yes grows new tiles on the map, one per tool
   the collective offers, read from its pod (onb:ServiceTile). They arrive as intents (the why), open one at a
   time, and get a first look like any tile. Opening a tool goes through the gate: WebID, membership, standing,
   sign-in. The collective's CRM moves the handshake (reminders, pause, renewal): paused, its tiles lock on the
   map and nothing is deleted. Reopened, "Join your network" is the tool for your collectives.
   Settings (the fold) and pins are the member's own, kept in their pod; simulated here in this browser. */
let COLS = [], colById = {}, CCOPY = {};
function loadCollectives(){
  const src = document.getElementById("collectives").textContent;
  const subj = {};
  new N3.Parser().parse(src).forEach(q=>{ ((subj[q.subject.value] ||= {})[q.predicate.value] ||= []).push(q.object); });
  const local = iri => iri.split("#").pop(), one = (o,k) => o[ONB+k] ? o[ONB+k][0].value : undefined;
  const tools = {}, rules = {}, events = {};
  Object.entries(subj).forEach(([s,o])=>{ if((o[RDFT]||[]).some(x=>x.value===ONB+"SampleEvent")) events[local(s)] = {title:one(o,"title"), at:one(o,"at"),
      date:one(o,"date") || new Date(Date.now() + (+one(o,"inDays")||0)*864e5).toISOString().slice(0,10)}; });   // onb:inDays: counted from today, so the calendar never shows the past
  Object.entries(subj).forEach(([s,o])=>{
    const type = (o[RDFT]||[]).map(x=>x.value), id = local(s);
    if(type.includes(ONB+"ServiceTile")) tools[id] = {id, kind:one(o,"kind"), icon:one(o,"icon"), title:one(o,"title"), cue:one(o,"cue"), say:one(o,"say"),
      blurb:one(o,"blurb"), url:one(o,"url"), storage:local(one(o,"storage")||"CollectivePod"), kept:one(o,"kept"), preview:one(o,"preview"), saidOpened:one(o,"saidOpened"),
      events:(o[ONB+"shows"]||[]).map(x=>events[local(x.value)]).filter(Boolean)};
    else if(type.includes(ONB+"RenewalRule")) rules[id] = {reminders:+one(o,"reminders"), every:+one(o,"everyDays")};
    else if(type.includes(ONB+"CollectiveCopy")) Object.keys(o).forEach(p=>{ if(p.startsWith(ONB)) CCOPY[p.slice(ONB.length)] = o[p][0].value; });
  });
  Object.entries(subj).forEach(([s,o])=>{
    if(!(o[RDFT]||[]).some(x=>x.value===ONB+"Collective")) return;
    COLS.push({id:local(s), name:one(o,"name"), domain:one(o,"domain"), offers:(o[ONB+"offers"]||[]).map(x=>tools[local(x.value)]).filter(Boolean),
      rule:o[ONB+"renewal"] ? rules[local(o[ONB+"renewal"][0].value)] : null});
  });
  colById = Object.fromEntries(COLS.map(c=>[c.id,c]));
  document.getElementById("colsrc").textContent = src.trim();
}
/* English possessive: "Brussels Makers'" not "Brussels Makers's". */
const poss = name => /s$/i.test(name) ? name+"'" : name+"'s";
const ff = (line, map) => { const out = String(line??"").replace(/\{(\w+)\}/g,(m,k)=>map[k]??m); const c = map.collective; return c && /s$/i.test(c) ? out.split(c+"'s").join(c+"'") : out; };
const sayC = (key, map={}, cls="") => CCOPY[key] ? `<p class="bernard ${cls}">— ${esc(ff(CCOPY[key],map))}</p>` : "";

/* ---------- the member's own settings and pins (their pod: settings/home.ttl, home/prefs.ttl) ---------- */
const SETTINGS_KEY = "mom-dryrun:settings", PREFS_KEY = "mom-dryrun:prefs";
function store(key, fallback){ try{ const v = JSON.parse(localStorage.getItem(key)||"null"); return v && typeof v==="object" ? {...fallback, ...v} : {...fallback}; }catch(_){ return {...fallback}; } }
function keep(key, v){ try{ localStorage.setItem(key, JSON.stringify(v)); }catch(_){ /* storage off: it lasts this visit */ } }
function drop(key){ try{ localStorage.removeItem(key); }catch(_){} }
let SETTINGS = store(SETTINGS_KEY, {fold:false, foldIntro:false});
let PREFS = store(PREFS_KEY, {pins:[]});
if(!Array.isArray(PREFS.pins)) PREFS.pins = [];
function setFold(v){ SETTINGS.fold = !!v; keep(SETTINGS_KEY, SETTINGS); render(); }
function settingsClear(){ drop(SETTINGS_KEY); SETTINGS = {fold:false, foldIntro:false}; }
function prefsClear(){ drop(PREFS_KEY); PREFS = {pins:[]}; }

/* ---------- the dry run's clock: membership falls due today, whenever the page is opened; each rule spaces its reminders ---------- */
const DAY = 864e5, TODAY = Math.floor(Date.now()/DAY)*DAY, DUE = TODAY;
const fmtDay = ms => new Date(ms).toLocaleDateString("en-GB",{day:"numeric",month:"short",timeZone:"UTC"});
const remindDay = (rule,k) => fmtDay(DUE + (k-1)*rule.every*DAY);
const pauseDay = rule => fmtDay(DUE + rule.reminders*rule.every*DAY);

/* ---------- joining: a request, then their answer (a timer stands in for the days it takes) ---------- */
const WAIT_S = 5;
function requestJoin(name){
  const n = String(name||"").trim(), lower = n.toLowerCase();
  let c = COLS.find(x=>x.name.toLowerCase()===lower) || COLS.find(x=>lower.length>2 && x.name.toLowerCase().includes(lower));
  if(!c){ c = {id:"x-"+slug(n), name:n||"Your network", domain:"", offers:[], rule:null, adhoc:true}; if(!colById[c.id]){ COLS.push(c); colById[c.id]=c; } }
  if(!S.hs[c.id]) S.hs[c.id] = {state:"requested", wait:WAIT_S, reminders:0, restored:false};
  ensureTick();
  return c;
}
let joinTick = null;
function ensureTick(){
  if(joinTick) return;
  joinTick = setInterval(()=>{
    if(S.role!=="space") return;   // while you play the network's side, the answer is yours to give there
    let pending = false, changed = false;
    Object.entries(S.hs).forEach(([id,h])=>{
      if(h.state!=="requested") return;
      if(--h.wait <= 0){ h.state = "active"; S.justAccepted = id; S.data.accepted = true; changed = true; } else pending = true;
    });
    if(!pending){ clearInterval(joinTick); joinTick = null; }
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"");
    if(changed || (!typing && S.selected==="join")) render();
  }, 1000);
}
function waitHtml(h){
  h = h || Object.values(S.hs).find(x=>x.state==="requested");
  return h ?`<p class="wait" role="status"><span class="dot" aria-hidden="true"></span>${esc(ff(CCOPY.uiWaitHint,{seconds:Math.max(h.wait,0)}))}</p>` : "";
}

/* ---------- a yes grows tiles: one per tool, in free slots next to the network's own tiles ---------- */
const SLOTS = [[3,1],[4,0],[2,2],[4,1],[3,2],[5,0],[5,-1],[4,2]];
const svcId = (c,tool) => `svc-${c.id}-${tool.id}`;
function svcSync(){
  const want = [];
  COLS.forEach(c=>{ const h = S.hs[c.id]; if(h && h.state!=="requested") c.offers.forEach(tool=>want.push({c, tool})); });
  const have = TILES.filter(t=>t.svc).map(t=>t.id);
  if(have.length===want.length && want.every(w=>have.includes(svcId(w.c,w.tool)))) return;
  TILES = TILES.filter(t=>!t.svc || want.some(w=>svcId(w.c,w.tool)===t.id));
  want.forEach(({c, tool})=>{
    const id = svcId(c,tool); if(TILES.some(t=>t.id===id)) return;
    const n = TILES.filter(t=>t.svc).length, used = new Set(TILES.map(t=>t.q+","+t.r));
    const [q,r] = SLOTS.find(([a,b])=>!used.has(a+","+b)) || [5, n-2];
    TILES.push({id, svc:{c:c.id, t:tool.id}, title:tool.title, cue:tool.cue, say:tool.say, q, r, prio:100+n, all:["join"], any:[], act:"svc", icon:tool.icon, needsPod:true});
  });
  byId = Object.fromEntries(TILES.map(t=>[t.id,t]));
  if(!byId[S.selected]) S.selected = "join";
}
function removeSvc(){
  TILES = TILES.filter(t=>!t.svc); byId = Object.fromEntries(TILES.map(t=>[t.id,t]));
  if(S){ S.done = S.done.filter(id=>!id.startsWith("svc-")); if(!byId[S.selected]) S.selected = isDone("join") ? "join" : "describe"; }
}
/* A collective's tiles open one at a time, outside the three-at-a-time of the tree; paused, they lock. */
function svcStates(st){
  if(Object.values(S.hs).some(h=>h.state==="requested")) ensureTick();
  COLS.forEach(c=>{
    const h = S.hs[c.id]; if(!h || h.state==="requested") return;
    const ts = TILES.filter(t=>t.svc && t.svc.c===c.id).sort((a,b)=>a.prio-b.prio);
    if(h.state==="paused"){ ts.forEach(t=>st[t.id]="lock"); return; }
    let opened = false;
    ts.forEach(t=>{ if(isDone(t.id)) st[t.id]="done"; else if(!opened){ st[t.id]="open"; opened=true; } else st[t.id]="cue"; });
  });
}

/* ---------- tile "Join your network", reopened: the tool for your collectives ---------- */
const WHERE = {CollectivePod:["coll","Data: {collective}'s server"], MemberPod:["mine","Data: your pod"], Mixed:["mix","Data: your pod, shown by theirs"]};
const whereHtml = (c, tool) => { const [wc, wl] = WHERE[tool.storage]||WHERE.CollectivePod; return `<span class="where"><i class="${wc}"></i>${esc(ff(wl,{collective:c.name}))}</span>`; };
const HEXI = `<svg viewBox="0 0 100 115.5" aria-hidden="true"><polygon points="50,4 96,30.4 96,85.1 50,111.5 4,85.1 4,30.4"/></svg>`;
const intentsHtml = offers => `<ul class="intents">${offers.map(o=>`<li>${HEXI}${esc(o.cue)}</li>`).join("")}</ul>`;
const toolOf = t => colById[t.svc.c].offers.find(o=>o.id===t.svc.t);
function hsChip(c, h){
  if(h.state==="requested") return `<span class="chip dashed">Request sent</span>`;
  if(h.state==="paused") return `<span class="chip dashed">Paused since ${esc(pauseDay(c.rule))}</span>`;
  if(h.state==="due") return `<span class="chip warn">Reminder ${h.reminders} of ${c.rule.reminders}</span>`;
  return `<span class="chip">Handshake${h.restored?" · restored":""}</span>`;
}
function joinPanel(t){
  const active = COLS.filter(c=>S.hs[c.id] && S.hs[c.id].state!=="requested");
  if(!active.length){
    const asked = COLS.find(c=>S.hs[c.id] && S.hs[c.id].state==="requested");
    const ahead = asked && asked.offers.length ? `<div class="out">${sayC("sayAhead",{collective:asked.name, count: asked.offers.length===1?"one thing":asked.offers.length+" things"})}${intentsHtml(asked.offers)}</div>` : "";
    return head(t.title) + say(t.saidDone) + preview(t, "What changed", "Dry run") + ahead;
  }
  const ja = S.justAccepted && colById[S.justAccepted];
  let intro = "";
  if(ja){
    const offers = ja.offers;
    intro = `<div class="band back" role="status">${sayC("sayAccepted",{collective:ja.name})}`
      + (offers.length ? sayC("sayOffers",{count: offers.length===1?"one thing":offers.length+" things"}) + intentsHtml(offers)
          + `<div class="row"><button type="button" data-go="${svcId(ja, offers[0])}">Take a first look →</button></div>` : sayC("sayNoTools"))
      + `</div>`;
  }
  return head(t.title, "Member") + intro + collectivesTool();
}
function collectivesTool(){
  const st = states();
  const mine = COLS.filter(c=>S.hs[c.id]);
  const withTools = mine.filter(c=>c.offers.length && S.hs[c.id].state!=="requested");
  const f = (v,l) => `<button type="button" data-filter="${esc(v)}" aria-pressed="${S.colFilter===v}">${esc(l)}</button>`;
  const filters = withTools.length > 1 || withTools.some(c=>c.offers.some(o=>o.storage!=="CollectivePod"))
    ? `<div class="cfilters adv" role="group" aria-label="Filter your collectives"><span class="k">Show</span>${f("all","All")}${withTools.length>1?withTools.map(c=>f("col:"+c.id,c.name)).join(""):""}
       ${withTools.some(c=>c.offers.some(o=>o.storage!=="CollectivePod")) ? `<span class="sep" aria-hidden="true"></span>`+f("mine","Data in your pod") : ""}</div>` : "";
  const pins = PREFS.pins.map(id=>byId[id]).filter(t=>t && t.svc && st[t.id]!=="fog");
  const pinRow = pins.length ? `<div class="pins adv"><span class="label" style="margin:0 4px 0 0">Pinned</span>${pins.map(t=>`<button type="button" data-open="${t.id}"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="${ICONS[st[t.id]==="lock"?"lock":t.icon]||ICONS.whiteboard}"/></svg>${esc(t.title)} <small>${esc(colById[t.svc.c].name)}</small></button>`).join("")}
    <span class="hint">Pins live in your pod. They follow you to any device.</span></div>` : "";
  const shown = S.colFilter.startsWith("col:") ? mine.filter(c=>c.id===S.colFilter.slice(4)) : mine;
  const notYet = COLS.filter(c=>!c.adhoc && !S.hs[c.id]);
  const others = notYet.length ? `<div class="others"><span class="hint">Dry run · ask another collective to join:</span>${notYet.map(c=>`<button type="button" class="ghost" data-join="${c.id}">${esc(c.name)}</button>`).join("")}</div>` : "";
  return sayC("sayShelves") + filters + pinRow + `<div class="shelves">${shown.map(c=>shelfHtml(c, st)).join("")}</div>` + others
    + (S.designer ? `<div class="designer"><span><b>home/prefs.ttl</b> (in your pod)</span><code>&lt;#me&gt; onb:pinned ${PREFS.pins.map(k=>"&lt;#"+esc(k)+"&gt;").join(" , ")||"()"} .</code>
       <span><b>Handshakes</b>, as each collective's pod states them</span>${mine.map(c=>`<code>${esc(c.name)}: ${esc(S.hs[c.id].state)}${S.hs[c.id].reminders?" · reminders "+S.hs[c.id].reminders:""}</code>`).join("")}</div>` : "");
}
function shelfHtml(c, st){
  const h = S.hs[c.id], r = c.rule;
  if(h.state==="requested") return `<div class="shelf quiet"><div class="shelf-head"><h3>${esc(c.name)}</h3>${hsChip(c,h)}</div>${sayC("sayWaiting",{collective:c.name})}${waitHtml(h)}</div>`;
  let tiles = TILES.filter(t=>t.svc && t.svc.c===c.id).sort((a,b)=>a.prio-b.prio);
  if(S.colFilter==="mine") tiles = tiles.filter(t=>toolOf(t).storage!=="CollectivePod");
  const cls = !c.offers.length ? " quiet" : h.state==="due" ? " due" : h.state==="paused" ? " paused" : "";
  const meta = !c.offers.length ? "no shared tools yet" : h.state==="due" ? "tools still open" : h.state==="paused" ? "sign-in closed, nothing deleted" : (c.domain ? "runs its own server · "+c.domain : "");
  const rows = tiles.map(t=>{
    const k = st[t.id], tool = toolOf(t);
    const what = k==="cue" ? `${esc(t.cue)} <span class="hint">· still ahead</span>` : esc(t.title);
    const btn = k==="done" ? "Open" : k==="open" ? "First look" : k==="lock" ? "Paused" : "See";
    return `<li><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="${ICONS[k==="lock"?"lock":t.icon]||ICONS.whiteboard}"/></svg><span class="w">${what}</span>${whereHtml(c,tool)}<button type="button" class="ghost" data-go="${t.id}">${btn}</button></li>`;
  }).join("");
  return `<div class="shelf${cls}"><div class="shelf-head"><h3>${esc(c.name)}</h3>${hsChip(c,h)}<span class="meta">${esc(meta)}</span><span class="grow"></span>
      ${r?`<button type="button" class="link" data-rule="${c.id}" aria-expanded="${S.ruleOpen===c.id}">The rules you agreed to</button>`:""}</div>
    ${S.ruleOpen===c.id && r ? `<p class="rule">${r.reminders} reminders, ${r.every} days apart, then ${esc(poss(c.name))} tools pause. Renewing brings them back. Nothing is deleted. This is ${esc(poss(c.name))} rule, read from their pod.</p>` : ""}
    ${bandHtml(c,h)}${rows?`<ul class="trows">${rows}</ul>`:""}${simHtml(c,h)}</div>`;
}
function bandHtml(c, h){
  const r = c.rule;
  if(h.state==="due"){
    const next = h.reminders < r.reminders ? remindDay(r, h.reminders+1) : pauseDay(r);
    const ladder = Array.from({length:r.reminders},(_,i)=>i+1).map(k=>`<li class="${k<h.reminders?"ok":k===h.reminders?"now":"next"}"><i>${k<h.reminders?"✓":k}</i>Reminder ${k} · ${esc(remindDay(r,k))}</li>`).join("")
      + `<li class="next"><i>‖</i>Tools pause · ${esc(pauseDay(r))}</li>`;
    return `<div class="band" role="status">${sayC("sayReminder",{collective:c.name, next})}<ol class="ladder" aria-label="${esc(poss(c.name))} renewal schedule">${ladder}</ol>
      <div class="row"><button type="button" data-renew="${c.id}">Renew with ${esc(c.name)} ↗</button><span class="hint">Dry run: their membership page would open. Here the renewal is recorded at once.</span></div></div>`;
  }
  if(h.state==="paused") return `<div class="band pause" role="status">${sayC("sayPaused",{collective:c.name})}
      ${steps([["✓","ok","<strong>Your pin stays on the map.</strong> The "+esc(c.name)+" badge on your card goes dashed until you renew."],["✓","ok","<strong>Your pins and settings stay.</strong> They live in your pod, not theirs."],["‖","","<strong>Their tiles lock</strong> until the membership is settled with them."]])}
      <div class="row"><button type="button" data-renew="${c.id}">Renew with ${esc(c.name)} ↗</button></div></div>`;
  if(h.restored) return `<div class="band back" role="status">${sayC("sayRestored")}
      ${steps([["✓","ok",`<strong>${esc(c.name)} recorded your renewal.</strong>`],["✓","ok","<strong>The handshake is solid again.</strong> Your card's badge too."],["✓","ok","<strong>Their tiles open again.</strong> Everything untouched."]])}</div>`;
  return "";
}
function simHtml(c, h){
  const r = c.rule; if(!r) return "";
  let btn;
  if(h.state==="paused") btn = `<button type="button" class="ghost" data-renew="${c.id}">Record a renewal</button>`;
  else if(h.reminders < r.reminders) btn = `<button type="button" class="ghost" data-remind="${c.id}">Send reminder ${h.reminders+1} of ${r.reminders}</button>`;
  else btn = `<button type="button" class="ghost" data-pause="${c.id}">Pause, as the rule says</button>`;
  return `<details class="sim"${S.simOpen===c.id?" open":""} data-sim="${c.id}"><summary>Dry run · play ${esc(poss(c.name))} side (their CRM)</summary><div class="row">${btn}
    ${h.state==="due"?`<button type="button" class="ghost" data-renew="${c.id}">Record a renewal</button>`:""}</div></details>`;
}

/* ---------- a collective's tile: first look, then the tool; locked while paused ---------- */
function svcPanel(t, s){
  const c = colById[t.svc.c], tool = toolOf(t), dom = (tool.url||"").replace(/^https?:\/\//,"");
  const label = `<p class="label">From ${esc(c.name)}</p>`;
  const facts = `<ul class="facts"><li><b>Run by</b><span>${esc(c.name)}, on their own server (${esc(dom)})</span></li>
    <li><b>Your data</b>${whereHtml(c,tool)}</li><li><b>Who gets in</b><span>Members. The gate checks your handshake each time.</span></li></ul>`;
  if(s==="lock") return label + head(t.title, "Paused") + sayC("sayRefused",{collective:c.name}) + `<p class="kept"><b>Kept:</b> ${esc(tool.kept||"everything")}.</p>`
    + `<div class="row" style="margin-top:12px"><button type="button" data-renew="${c.id}">Renew with ${esc(c.name)} ↗</button><button type="button" class="ghost" data-go="join">Your collectives</button></div>`;
  const first = s!=="done", pinned = PREFS.pins.includes(t.id);
  const star = `<button type="button" class="star adv" data-pin="${t.id}" aria-pressed="${pinned}" aria-label="${pinned?"Unpin":"Pin"} ${esc(t.title)}, ${esc(c.name)}">${STAR}</button>`;
  let body = label + `<div class="head"><h2>${esc(t.title)}</h2>${first?"":star}</div>` + (first ? say(t.say) : `<p class="hint">${esc(tool.blurb||"")}</p>`) + facts;
  if(S.gate && S.gate.tile===t.id) body += gateHtml(t, c, tool);
  else body += `<div class="row" style="margin-top:14px"><button type="button" data-open="${t.id}">${first?"Open it, a first look":"Open ↗"}</button>${first?"":`<span class="hint adv">Pin it to reach it from your collectives.</span>`}</div>`;
  return body;
}
function gateHtml(t, c, tool){
  const h = S.hs[c.id], n = S.gate.step;
  const list = [
    ["Your WebID", `https://${podName()}.pod.mapsofmaking.org/profile/card#me`],
    [`${c.name} lists you as a member`, "read from their pod"],
    [h.state==="due" ? `Membership due, still open until ${pauseDay(c.rule)}` : "Membership in good standing", c.rule ? `their rule: ${c.rule.reminders} reminders, then a pause` : ""],
    [`Signed in to ${t.title} as ${S.data.accEmail||S.data.email||"the space's mailbox"}`, "group: members"]];
  const rows = list.map(([lab, note], i)=>[i<n?"✓":String(i+1), i<n?"ok":i===n?"now":"", i<n?`<strong>${esc(lab)}.</strong> <span class="hint">${esc(note)}</span>`:esc(lab)+(i===n?"…":"")]);
  const done = n >= list.length;
  return `<div class="out">${sayC("sayGate",{collective:c.name})}${steps(rows)}</div>`
    + (done ? `<div class="preview">${frame((tool.url||"").replace(/^https?:\/\//,""),"Dry run · the real tool opens here")}
        ${tool.kind==="calendar" ? calendarHtml(c, tool) : tool.preview && /^https:\/\//.test(tool.preview)
          ? `<figure class="toolframe shot"><img src="${esc(PREVIEW_COPIES[tool.preview]||tool.preview)}" alt="ExcaliDash: a workspace of drawings, the tool ${esc(c.name)} runs" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><p class="hint" hidden>The screenshot didn't load. Here ${esc(t.title)} opens, run by ${esc(c.name)} on their own server.</p><figcaption class="hint">ExcaliDash, as ${esc(c.name)} would run it, signed in through the gate. Screenshot: excalidash.xyz</figcaption></figure>`
          : `<div class="toolframe"><p class="hint">Here ${esc(t.title)} opens, run by ${esc(c.name)} on their own server, with you signed in through the gate.</p></div>`}</div>
        <div class="out">${tool.saidOpened ? `<p class="bernard">— ${esc(ff(tool.saidOpened,{collective:c.name}))}</p>` : sayC("sayOpened",{collective:c.name})}${backToTiles()}</div>` : "");
}
/* The network's calendar: other members' events from their own pods, and yours once "Share your events" is done.
   Posted once, on your card; shared, it shows here too. Nothing is copied: the calendar reads your pod. */
function calendarHtml(c, tool){
  const day = d => { const t = Date.parse(d); return isNaN(t) ? d : new Date(t).toLocaleDateString("en-GB",{weekday:"short", day:"numeric", month:"short", timeZone:"UTC"}); };
  const ev = S.data.event, shared = ev && isDone("agenda");
  const rows = [...tool.events.map(e=>({...e, mine:false})), ...(shared ? [{title:ev.title, date:ev.date, at:S.data.name, mine:true}] : [])]
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const note = !ev ? `<p class="hint">Post an event on your card, then share it: it shows up here, beside your peers'.</p>`
    : !shared ? `<div class="row"><p class="hint" style="margin:0">Your event, ${esc(ev.title)} on ${esc(day(ev.date))}, is on your card but not shared yet.${states().agenda==="open"?"":" Sharing is one of your next tiles: it opens as you clear the ones in front of it."}</p>${states().agenda==="open"?`<button type="button" class="ghost" data-go="agenda">Share your events →</button>`:""}</div>` : "";
  return `<div class="cal" role="region" aria-label="${esc(poss(c.name))} calendar"><ul>${rows.map(r=>`<li class="${r.mine?"mine":""}"><span class="d">${esc(day(r.date))}</span><span class="t"><b>${esc(r.title)}</b> <span class="hint">at ${esc(r.at)}</span></span>${r.mine?`<span class="chip">Yours · from your pod</span>`:`<span class="hint">from their pod</span>`}</li>`).join("")}</ul>${note}</div>`;
}
let gateTimer = null;
function openTool(id){
  const t = byId[id]; if(!t || !t.svc) return;
  clearTimeout(gateTimer); S.selected = id; S.view = null; S.gate = {tile:id, step:0}; render();
  const tick = () => {
    if(!S.gate || S.gate.tile!==id) return;
    S.gate.step++;
    if(S.gate.step>=4 && !isDone(id)) S.done.push(id);
    render();
    if(S.gate.step<4) gateTimer = setTimeout(tick, 550);
  };
  gateTimer = setTimeout(tick, 550);
}
function wireCollectives(){
  const b = document.getElementById("bench");
  const on = (sel, fn) => b.querySelectorAll(sel).forEach(el=>el.addEventListener("click", e=>fn(e.currentTarget)));
  on("[data-filter]", el=>{ S.colFilter = el.dataset.filter; render(); });
  on("[data-pin]", el=>{ const k=el.dataset.pin, i=PREFS.pins.indexOf(k); if(i<0) PREFS.pins.push(k); else PREFS.pins.splice(i,1); keep(PREFS_KEY, PREFS); render(); });
  on("[data-open]", el=>openTool(el.dataset.open));
  on("[data-rule]", el=>{ S.ruleOpen = S.ruleOpen===el.dataset.rule ? null : el.dataset.rule; render(); });
  on("[data-remind]", el=>{ const h=S.hs[el.dataset.remind]; h.reminders++; h.state="due"; h.restored=false; S.simOpen=el.dataset.remind; render(); });
  on("[data-pause]", el=>{ const h=S.hs[el.dataset.pause]; h.state="paused"; h.restored=false; S.simOpen=el.dataset.pause; S.gate=null; render(); });
  on("[data-renew]", el=>{ const id=el.dataset.renew, h=S.hs[id]; h.state="active"; h.reminders=0; h.restored=true; S.simOpen=id; render(); });
  on("[data-join]", el=>{ requestJoin(colById[el.dataset.join].name); render(); });
  b.querySelectorAll("details.sim").forEach(d=>d.addEventListener("toggle",()=>{ if(d.open) S.simOpen=d.dataset.sim; else if(S.simOpen===d.dataset.sim) S.simOpen=null; }));
}

/* ---------- roles: the same story from the network's side (prospective) ----------
   The space's side is the home app above. The network has two desks, as collectives do: welcome answers
   requests and never sees fees; treasury follows the renewal rule the network published in its own pod.
   Both read the handshake state the space's side reads: one state, three views. */
const ROLES = [["space","","Space"],["welcome","Network","Welcome"],["treasury","Network","Treasury"]];
const netCol = () => COLS.find(c=>S.hs[c.id]) || colById.bm || COLS[0];
const spaceName = () => S.data.name || "The space";
/* The network's other members: the ones its calendar already shows events from. */
const peersOf = c => [...new Set(c.offers.flatMap(o=>o.events||[]).map(e=>e.at))];
function netChip(h){
  if(!h) return "";
  if(h.state==="requested") return `<span class="chip warn">Request</span>`;
  if(h.state==="paused") return `<span class="chip dashed">Paused</span>`;
  if(h.state==="due") return `<span class="chip warn">Due · reminder ${h.reminders}</span>`;
  return `<span class="chip">Member</span>`;
}
function networkPanel(role){
  const c = netCol(), h = S.hs[c.id], peers = peersOf(c), treas = role==="treasury";
  if(h && !S.netSel) S.netSel = "me";
  const item = (key, name, chip, note, isNew) => `<li><button type="button" class="net-item${isNew?" new":""}" data-net="${esc(key)}" aria-current="${S.netSel===key}"><b>${esc(name)}</b>${chip}${note?`<small>${esc(note)}</small>`:""}</button></li>`;
  const mine = h ? item("me", spaceName(), netChip(h), h.state==="requested" ? "Asked today, from its own pod" : treas && h.state==="due" ? "Next step on "+(h.reminders<c.rule.reminders ? remindDay(c.rule,h.reminders+1) : pauseDay(c.rule)) : "", h.state==="requested" || (treas && h.state==="due")) : "";
  const list = `<ul class="net-list">${mine}${peers.map(p=>item("p:"+p, p, `<span class="chip">Member</span>`, treas ? "In good standing" : "")).join("")}</ul>`;
  const count = treas ? `${peers.length + (h && h.state==="active" ? 1 : 0)} in good standing${h && h.state==="due" ? " · 1 due" : ""}${h && h.state==="paused" ? " · 1 paused" : ""}`
    : `${peers.length + (h && h.state!=="requested" ? 1 : 0)} members${h && h.state==="requested" ? " · 1 request" : ""}`;
  const left = `<p class="label">${treas?"Memberships":"Requests and members"}</p><p class="tally" style="margin:0 0 10px">${esc(count)}</p>${list}
    <p class="hint" style="margin-top:10px">${treas ? "The rule and the dates are the network's own, kept in its pod." : "No fees or amounts on this side: that is the treasury's."}</p>`;
  let right;
  if(S.netSel && S.netSel.startsWith("p:")) right = head(S.netSel.slice(2), "Member") + `<p class="hint">A member since before this story. Its profile is read from its own pod, like every member's.</p>`;
  else if(!h) right = head("Nothing to answer yet") + `<p class="hint">No request has come in. On the space's side, a space on the map asks to join from the tile “Join your network”.</p>
      <div class="row" style="margin-top:12px"><button type="button" class="ghost" data-role="space">Go to the space's side</button></div>`;
  else right = treas ? treasuryDetail(c, h) : welcomeDetail(c, h);
  return `<p class="label">${esc(c.name)} · ${treas?"treasury":"welcome"}</p><div class="tool"><div>${left}</div><div>${right}</div></div>`;
}
function welcomeDetail(c, h){
  const d = S.data, web = `https://${podName()}.pod.mapsofmaking.org/profile/card#me`;
  const opens = c.offers.length ? `<ul class="trows">${c.offers.map(o=>`<li><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="${ICONS[o.icon]||ICONS.whiteboard}"/></svg><span class="w">${esc(o.title)}</span>${whereHtml(c,o)}<span></span></li>`).join("")}</ul>` : `<p class="hint">${esc(c.name)} shares no tools yet.</p>`;
  if(h.state==="requested") return head(spaceName(), "Request")
    + `<ul class="facts"><li><b>Who asks</b><span class="addr">${esc(web)}</span></li>
        <li><b>Where</b><span>${esc(locality(d.address) || "not said")}</span></li>
        <li><b>Contact</b><span>${esc(d.email || "not said")}</span></li></ul>
      <p class="hint" style="margin-top:8px">Read from the space's own pod, not typed again here. When the space changes a line, this page shows the new one.</p>
      <p class="label" style="margin-top:16px">A yes opens</p>${opens}
      <div class="row" style="margin-top:14px"><button type="button" data-accept="${c.id}">Say yes</button><span class="hint">Saying yes stays a person's decision. Dry run: left alone on the space's side, the answer comes after a few seconds.</span></div>`;
  return head(spaceName(), h.state==="paused" ? "Paused" : "Member")
    + steps([["✓","ok",`<strong>Listed as a member in ${esc(poss(c.name))} pod.</strong> The space states the same in its own: a handshake.`],
        ["✓","ok", c.offers.length ? `<strong>${c.offers.map(o=>esc(o.title)).join(" and ")} let it in.</strong> Each tool's gate reads the handshake. No account was made by hand.` : `<strong>The badge shows on its card.</strong>`],
        [h.state==="paused"?"‖":"✓", h.state==="paused"?"":"ok", h.state==="paused" ? `<strong>Paused by the treasury's rule.</strong> The tools refuse it for now. Nothing is deleted.` : `<strong>Its card on the map carries your badge.</strong>`]])
    + `<p class="label" style="margin-top:16px">Open to it</p>${opens}`;
}
function treasuryDetail(c, h){
  const r = c.rule;
  const ahead = `<p class="ahead">Still ahead in this dry run: the fee itself, and an export of memberships to the network's own CRM (Zoho, Dolibarr, Odoo).</p>`;
  if(h.state==="requested") return head(spaceName(), "Not a member yet") + `<p class="hint">The welcome side answers the request first. Nothing to follow here until then.</p>` + ahead;
  if(!r) return head(spaceName(), "Member") + `<p class="hint">${esc(c.name)} has published no renewal rule, so nothing falls due.</p>` + ahead;
  const rule = `<p class="rule">The rule ${esc(c.name)} published, and each member accepted on joining: ${r.reminders} reminders, ${r.every} days apart, then the tools pause. A renewal brings them back.</p>`;
  const ladder = `<ol class="ladder" style="margin:12px 0" aria-label="Renewal schedule">${Array.from({length:r.reminders},(_,i)=>i+1).map(k=>`<li class="${k<h.reminders || h.state==="paused" ? "ok" : k===h.reminders ? "now" : "next"}"><i>${k<h.reminders || h.state==="paused" ? "✓" : k}</i>Reminder ${k} · ${esc(remindDay(r,k))}</li>`).join("")}<li class="${h.state==="paused"?"now":"next"}"><i>‖</i>Tools pause · ${esc(pauseDay(r))}</li></ol>`;
  const renew = `<button type="button" class="ghost" data-renew="${c.id}">Record a renewal</button>`;
  if(h.state==="paused") return head(spaceName(), "Paused") + rule + ladder + `<p class="hint">The tools refuse this member since ${esc(pauseDay(r))}. Nothing was deleted, on your server or in its pod.</p><div class="row" style="margin-top:12px">${renew}</div>` + ahead;
  if(h.state==="due"){
    const next = h.reminders < r.reminders ? `<button type="button" data-remind="${c.id}">Send reminder ${h.reminders+1} of ${r.reminders}</button>` : `<button type="button" data-pause="${c.id}">Pause, as the rule says</button>`;
    return head(spaceName(), `Due · reminder ${h.reminders} of ${r.reminders}`) + rule + ladder + `<p class="hint">The member sees the same schedule on its side, and the tools stay open meanwhile.</p><div class="row" style="margin-top:12px">${next}${renew}</div>` + ahead;
  }
  return head(spaceName(), h.restored ? "Renewed" : "In good standing") + rule
    + (h.restored ? steps([["✓","ok","<strong>Renewal recorded.</strong>"],["✓","ok","<strong>The tools let it in again.</strong> Nothing had to be set up anew."]]) : "")
    + `<div class="row" style="margin-top:12px"><button type="button" data-remind="${c.id}">Send reminder 1 of ${r.reminders}</button><span class="hint">Dry run: this jumps to the day the membership falls due.</span></div>` + ahead;
}
function renderRoles(){
  document.getElementById("roles").innerHTML = ROLES.map(([id,group,label])=>`<button type="button" role="tab" data-role="${id}" aria-selected="${S.role===id}">${group?`<small>${group}</small>`:""}${label}</button>`).join("");

function wireNetwork(){
